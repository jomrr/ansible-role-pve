---
# role: pve
# file: handlers/main.yml

- name: "PVE | Apply sysctl hardening"
  ansible.builtin.command:
    argv:
      - sysctl
      - "--load={{ __pve_hardening_sysctl_config_path }}"
  changed_when: true
  listen: pve apply sysctl hardening
  when:
    - __pve_hardening_sysctl_apply_runtime | bool
    - not __pve_is_container | default(false) | bool

- name: "PVE | Reload sshd"
  ansible.builtin.systemd_service:
    name: "{{ __pve_hardening_sshd_service_name }}"
    state: reloaded
  listen: pve reload sshd
  when:
    - not __pve_is_container | default(false) | bool

- name: "PVE | Load audit rules"
  ansible.builtin.command:
    argv:
      - augenrules
      - --load
  changed_when: true
  listen: pve load audit rules
  when:
    - pve_hardening_auditd_enabled | bool
    - not __pve_is_container | default(false) | bool

- name: "PVE | Reload systemd"
  ansible.builtin.systemd_service:
    daemon_reload: true
  listen: pve reload systemd
  when: not __pve_is_container | default(false) | bool

- name: "PVE | Reboot into Proxmox VE kernel"
  ansible.builtin.reboot:
    reboot_timeout: 900
  listen: pve reboot into proxmox kernel
  when: not __pve_is_container | default(false) | bool

- name: "PVE | Refresh facts after Proxmox VE kernel reboot"
  ansible.builtin.setup:
  listen: pve refresh facts after proxmox kernel reboot
  when: not __pve_is_container | default(false) | bool

- name: "PVE | Refresh proxmox boot entries"
  ansible.builtin.command:
    argv:
      - "{{ __pve_kernel_cmdline_proxmox_boot_tool_path }}"
      - refresh
  changed_when: true
  listen: pve refresh proxmox boot
  when: not __pve_is_container | default(false) | bool

- name: "PVE | Update grub"
  ansible.builtin.command:
    argv:
      - "{{ __pve_kernel_cmdline_update_grub_path }}"
  changed_when: true
  listen: pve update grub
  when: not __pve_is_container | default(false) | bool

---
# role: pve
# file: meta/argument_specs.yml

argument_specs:
  main:
    short_description: Manage Proxmox VE nodes and clusters
    description:
      - Installs the Proxmox VE package set on Debian hosts.
      - Configures the Proxmox VE no-subscription repository and warning suppression hook.
      - Manages Proxmox VE HA service state with explicit per-service booleans.
      - Applies Debian CIS Level 2 inspired host hardening that is safe for Proxmox VE,
        KVM, LXC, and cluster operation.
    options:
      pve_no_subscription:
        type: bool
        required: false
        default: true
        description: Enable the Proxmox VE no-subscription repository and suppress the no-subscription
          warning.
      pve_ha_services:
        type: dict
        required: false
        default:
          pve-ha-lrm.service: false
          pve-ha-crm.service: false
          corosync.service: false
        description: Map of Proxmox VE HA systemd units to booleans. True unmasks and enables
          a unit; false stops, disables, and masks it.
      pve_hardening_enabled:
        type: bool
        required: false
        default: true
        description: Enable PVE-safe host hardening tasks.
      pve_hardening_disable_usb_storage:
        type: bool
        required: false
        default: false
        description: Blacklist usb-storage. This is opt-in because removable media may be
          operationally required.
      pve_hardening_disable_overlayfs:
        type: bool
        required: false
        default: false
        description: Blacklist overlayfs. This is opt-in because it can affect container
          workflows.
      pve_hardening_disable_squashfs:
        type: bool
        required: false
        default: false
        description: Blacklist squashfs. This is opt-in because some operational workflows
          use squashfs images.
      pve_hardening_auditd_enabled:
        type: bool
        required: false
        default: true
        description: Install and enable auditd on non-container hosts.
      pve_hardening_auditd_halt_on_full:
        type: bool
        required: false
        default: false
        description: Halt the host when audit storage is full. Disabled by default for availability.
      pve_hardening_audit_immutable:
        type: bool
        required: false
        default: false
        description: Make audit rules immutable until reboot. Disabled by default for operational
          safety.
      pve_hardening_sshd_manage:
        type: bool
        required: false
        default: true
        description: Manage a small PVE-safe sshd hardening drop-in.
      pve_hardening_sshd_permit_root_login:
        type: str
        required: false
        default: prohibit-password
        description: Value for sshd PermitRootLogin in the managed drop-in.
      pve_hardening_sshd_disable_forwarding:
        type: bool
        required: false
        default: false
        description: Set sshd DisableForwarding yes. Disabled by default to avoid breaking
          administrative workflows.
      pve_hardening_tmp_acl_enabled:
        type: bool
        required: false
        default: true
        description: Ensure shared temporary directories have root ownership and the sticky
          bit where appropriate.
      pve_cmdline:
        type: dict
        required: false
        default:
          mitigations=auto: true
          debugfs=off: true
          init_on_alloc=1: true
          init_on_free=1: true
          kexec_load_disabled=1: true
          lockdown=integrity: true
          module.sig_enforce=1: true
          page_alloc.shuffle=1: true
          pti=on: true
          randomize_kstack_offset=on: true
          slab_nomerge: true
          spec_store_bypass_disable=on: true
          vsyscall=none: true
          efi=disable_early_pci_dma: true
          iommu=force: true
          iommu.strict=1: true
          intel_iommu=on: true
          amd_iommu=force_isolation: true
        description: Map of kernel command line arguments to booleans. Enabled arguments
          are added while existing arguments are preserved; Intel and AMD arguments are
          applied only on matching CPU vendors. Kernel command line changes require a reboot.

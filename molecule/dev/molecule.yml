---
# role: pve
# file: molecule/dev/molecule.yml

dependency:
  name: "galaxy"
driver:
  name: "default"
provisioner:
  name: "ansible"
  config_options:
    defaults:
      forks: 8
      interpreter_python: "auto_silent"
      allow_world_readable_tmpfiles: true
      callbacks_enabled: "ansible.posix.profile_tasks,ansible.posix.timer"
      callback_result_format: "yaml"
      remote_tmp: "/tmp/.ansible/tmp"
    ssh_connection:
      pipelining: true
  log: true
  playbooks:
    converge: "converge.yml"
    verify: "verify.yml"
    create: "create.yml"
    destroy: "destroy.yml"
    prepare: "prepare.yml"
  inventory:
    group_vars:
      all:
        pve_no_subscription: true
        pve_hardening_enabled: true
        pve_hardening_auditd_enabled: true
    host_vars:
      molecule-pve-dev:
        ansible_remote_tmp: "/home/molecule/.ansible/tmp"
verifier:
  name: "ansible"
scenario:
  test_sequence:
    - "destroy"
    - "syntax"
    - "create"
    - "prepare"
    - "converge"
    - "idempotence"
    - "verify"
    - "destroy"
  destroy_sequence:
    - "destroy"
  name: "dev"
platforms:
  - name: "molecule-pve-dev"
    libvirt_uri: "qemu:///system"
    libvirt_network: "default"
    image_url: "https://cloud.debian.org/images/cloud/trixie/latest/debian-13-genericcloud-amd64.qcow2"

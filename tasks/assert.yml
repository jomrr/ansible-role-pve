---
# role: pve
# file: tasks/assert.yml

- name: "PVE | Assert supported inputs"
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution | default('') == 'Debian'
      - ansible_facts.distribution_release | default('') in __pve_proxmox_apt_keyrings
      - (pve_ha_services | default({}) | dict2items | map(attribute='key') | difference(__pve_allowed_ha_services) | length) == 0
      - pve_hardening_sshd_permit_root_login in __pve_sshd_permit_root_login_values
    fail_msg: >-
      The pve role supports targets with ansible_facts.distribution set to Debian, a supported Debian release codename,
      the configured sshd PermitRootLogin values, and only the explicitly allowed PVE HA services.
  vars:
    __pve_allowed_ha_services:
      - pve-ha-lrm.service
      - pve-ha-crm.service
      - corosync.service
    __pve_sshd_permit_root_login_values:
      - "yes"
      - prohibit-password
      - forced-commands-only
      - "no"
      - without-password

- name: "PVE | Query enabled APT update URIs"
  ansible.builtin.command:
    argv:
      - apt-get
      - --print-uris
      - update
  register: __pve_enabled_apt_update_uris
  check_mode: false
  changed_when: false
  failed_when: false
  when: pve_no_subscription | bool

- name: "PVE | Fail when Proxmox VE enterprise repository is enabled"
  ansible.builtin.fail:
    msg: "The pve role refuses to run while the Proxmox VE enterprise repository is enabled."
  when:
    - pve_no_subscription | bool
    - __pve_enabled_apt_update_uris.stdout | default('') is search('enterprise\\.proxmox\\.com/debian/pve.*pve-enterprise')

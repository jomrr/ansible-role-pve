---
# role: pve
# file: tasks/assert.yml

- name: "PVE | Assert supported inputs"
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution | default('') == 'Debian'
      - ansible_facts.distribution_release | default('') in __pve_proxmox_apt_keyrings
      - pve_hardening_sshd_permit_root_login in __pve_sshd_permit_root_login_values
    fail_msg: >-
      The pve role supports targets with ansible_facts.distribution set to Debian, a supported Debian release codename,
      and the configured sshd PermitRootLogin values.
  vars:
    __pve_sshd_permit_root_login_values:
      - "yes"
      - prohibit-password
      - forced-commands-only
      - "no"
      - without-password

- name: "PVE | Query hostname IP addresses"
  ansible.builtin.command:
    argv:
      - hostname
      - --ip-address
  register: __pve_hostname_ip_address
  check_mode: false
  changed_when: false
  failed_when: false
  when: not __pve_is_container | bool

- name: "PVE | Assert hostname resolves to non-loopback address"
  ansible.builtin.assert:
    that:
      - __pve_hostname_ip_address.rc == 0
      - (__pve_hostname_ip_address.stdout | split | length) > 0
      - >-
        (__pve_hostname_ip_address.stdout | split
        | select('match', __pve_loopback_ip_pattern)
        | list | length) == 0
    fail_msg: >-
      The Proxmox VE hostname must resolve to at least one non-loopback IP address before pmxcfs starts. Fix /etc/hosts
      or DNS so hostname --ip-address does not return 127.0.1.1, 127.0.0.1, or ::1.
  when: not __pve_is_container | bool

- name: "PVE | Query enabled APT update URIs"
  ansible.builtin.command:
    argv:
      - apt-get
      - --print-uris
      - update
  register: __pve_enabled_apt_update_uris
  check_mode: false
  changed_when: false
  failed_when: false
  when: pve_no_subscription | bool

- name: "PVE | Fail when Proxmox VE enterprise repository is enabled"
  ansible.builtin.fail:
    msg: "The pve role refuses to run while the Proxmox VE enterprise repository is enabled."
  when:
    - pve_no_subscription | bool
    - __pve_enabled_apt_update_uris.stdout | default('') is search('enterprise\\.proxmox\\.com/debian/pve.*pve-enterprise')

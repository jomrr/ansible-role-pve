---
# role: pve
# file: tasks/facts.yml

- name: "PVE | Collect package facts"
  ansible.builtin.package_facts:
    manager: auto

- name: "PVE | Collect service facts"
  ansible.builtin.service_facts:

- name: "PVE | Stat PVE filesystem markers"
  ansible.builtin.stat:
    path: "{{ item }}"
  register: __pve_marker_stats
  loop: "{{ __pve_marker_paths }}"

- name: "PVE | Stat no-subscription JavaScript candidates"
  ansible.builtin.stat:
    path: "{{ item }}"
  register: __pve_nag_candidate_stats
  loop: "{{ __pve_no_subscription_nag_candidate_paths }}"

- name: "PVE | Set base detection facts"
  ansible.builtin.set_fact:
    __pve_is_container: "{{ __pve_virtualization_type in __pve_container_types }}"
    __pve_package_names: "{{ (ansible_facts['packages'] | default({})).keys() | list }}"
    __pve_service_names: "{{ (ansible_facts['services'] | default({})).keys() | list }}"
    __pve_mounts_by_mount: {}
    __pve_etc_pve_exists: "{{ __pve_marker_stats.results[0].stat.exists | bool }}"
    __pve_no_subscription_nag_target_exists: >-
      {{ __pve_nag_candidate_stats.results | selectattr('stat.exists') | list | length > 0 }}
    __pve_no_subscription_nag_target_path: >-
      {{ (__pve_nag_candidate_stats.results | selectattr('stat.exists') | map(attribute='item') | list | first)
        | default(__pve_no_subscription_nag_candidate_paths[0]) }}
  vars:
    __pve_virtualization_type: "{{ ansible_facts['virtualization_type'] | default('') }}"

- name: "PVE | Index mount facts by mountpoint"
  ansible.builtin.set_fact:
    __pve_mounts_by_mount: "{{ __pve_mounts_by_mount | combine({(item['mount']): item}) }}"
  loop: "{{ ansible_facts['mounts'] | default([]) }}"
  loop_control:
    label: "{{ item['mount'] }}"

- name: "PVE | Stat tmp.mount unit files"
  ansible.builtin.stat:
    path: "{{ item }}"
  register: __pve_tmp_mount_unit_stats
  loop: "{{ __pve_tmp_mount_unit_paths }}"

- name: "PVE | Set tmp.mount facts"
  ansible.builtin.set_fact:
    __pve_tmp_mount_active: "{{ __pve_tmp_mount_state in __pve_tmp_mount_active_states }}"
    __pve_tmp_mount_available: >-
      {{ ('tmp.mount' in __pve_service_names)
        or (__pve_tmp_mount_unit_stats.results | selectattr('stat.exists') | list | length > 0) }}
    __pve_tmp_mount_masked: "{{ __pve_tmp_mount_status == 'masked' }}"
  vars:
    __pve_tmp_mount_service: "{{ ansible_facts['services']['tmp.mount'] | default({}) }}"
    __pve_tmp_mount_state: "{{ __pve_tmp_mount_service.state | default('') }}"
    __pve_tmp_mount_status: "{{ __pve_tmp_mount_service.status | default('') }}"

- name: "PVE | Set PVE detection facts"
  ansible.builtin.set_fact:
    __pve_detected: >-
      {{ (__pve_package_names | intersect(__pve_package_markers) | length > 0)
        or (__pve_service_names | intersect(__pve_service_markers) | length > 0)
        or __pve_etc_pve_exists
        or __pve_pveversion_exists
        or __pve_no_subscription_nag_target_exists }}
  vars:
    __pve_pveversion_exists: "{{ __pve_marker_stats.results[1].stat.exists | bool }}"

- name: "PVE | Stat HA resources configuration"
  ansible.builtin.stat:
    path: "{{ __pve_ha_resources_config_path }}"
  register: __pve_ha_resources_stat
  when: __pve_etc_pve_exists | bool

- name: "PVE | Read HA resources configuration"
  ansible.builtin.slurp:
    src: "{{ __pve_ha_resources_config_path }}"
  register: __pve_ha_resources_slurp
  failed_when: false
  when:
    - __pve_etc_pve_exists | bool
    - __pve_ha_resources_stat.stat.exists | default(false) | bool

- name: "PVE | Set HA resources facts"
  ansible.builtin.set_fact:
    __pve_ha_resources_configured: "{{ (__pve_ha_resources_content | regex_replace('(?m)^\\s*#.*$', '') | trim | length) > 0 }}"
  vars:
    __pve_ha_resources_content: "{{ __pve_ha_resources_slurp.content | default('') | b64decode }}"

- name: "PVE | Fail when target is not Proxmox VE"
  ansible.builtin.fail:
    msg: >-
      This host does not look like a Proxmox VE node. Set pve_fail_when_not_proxmox to false for Debian container tests
      or plain Debian dry-runs.
  when:
    - pve_fail_when_not_proxmox | bool
    - not __pve_detected | bool

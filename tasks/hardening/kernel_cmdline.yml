---
# role: pve
# file: tasks/hardening/kernel_cmdline.yml

- name: "PVE | Stat proxmox kernel command line"
  ansible.builtin.stat:
    path: "{{ __pve_kernel_cmdline_path }}"
  register: __pve_kernel_cmdline_file

- name: "PVE | Build enabled kernel command line arguments"
  ansible.builtin.set_fact:
    __pve_kernel_cmdline_args: >-
      {{
        pve_cmdline
        | dict2items
        | selectattr('value')
        | map(attribute='key')
        | list
      }}

- name: "PVE | Remove Intel-only kernel command line arguments on non-Intel CPUs"
  ansible.builtin.set_fact:
    __pve_kernel_cmdline_args: "{{ __pve_kernel_cmdline_args | reject('in', __pve_kernel_cmdline_intel_only_args) | list }}"
  when: "'intel' not in (ansible_facts['processor'] | default([]) | join(' ') | lower)"

- name: "PVE | Remove AMD-only kernel command line arguments on non-AMD CPUs"
  ansible.builtin.set_fact:
    __pve_kernel_cmdline_args: "{{ __pve_kernel_cmdline_args | reject('in', __pve_kernel_cmdline_amd_only_args) | list }}"
  when: "'amd' not in (ansible_facts['processor'] | default([]) | join(' ') | lower)"

- name: "PVE | Manage proxmox kernel command line arguments"
  when: __pve_kernel_cmdline_file.stat.exists | bool
  block:
    - name: "PVE | Fail when proxmox kernel command line is empty"
      ansible.builtin.fail:
        msg: >-
          {{ __pve_kernel_cmdline_path }} exists but contains no kernel command line. Fix the proxmox-boot-tool
          setup before applying PVE kernel command line hardening.
      when: __pve_kernel_cmdline_file.stat.size | int <= 1

    - name: "PVE | Add proxmox kernel command line key-value arguments"
      ansible.builtin.replace:
        path: "{{ __pve_kernel_cmdline_path }}"
        regexp: '^((?=.*\S)(?!.*(?:^|\s){{ item.split("=")[0] | regex_escape }}=).*)$'
        replace: '\1 {{ item }}'
      notify: pve refresh proxmox boot
      loop: "{{ __pve_kernel_cmdline_args }}"
      when: "'=' in item"

    - name: "PVE | Add proxmox kernel command line flag arguments"
      ansible.builtin.replace:
        path: "{{ __pve_kernel_cmdline_path }}"
        regexp: '^((?=.*\S)(?!.*(?:^|\s){{ item | regex_escape }}(?:\s|$)).*)$'
        replace: '\1 {{ item }}'
      notify: pve refresh proxmox boot
      loop: "{{ __pve_kernel_cmdline_args }}"
      when: "'=' not in item"

- name: "PVE | Manage GRUB kernel command line fallback"
  when: not __pve_kernel_cmdline_file.stat.exists | bool
  block:
    - name: "PVE | Ensure GRUB drop-in directory exists"
      ansible.builtin.file:
        path: "{{ __pve_kernel_cmdline_grub_dropin_path | dirname }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: "PVE | Install GRUB kernel command line drop-in"
      ansible.builtin.template:
        src: grub-pve-hardening.cfg.j2
        dest: "{{ __pve_kernel_cmdline_grub_dropin_path }}"
        owner: root
        group: root
        mode: "0644"
      notify: pve update grub

---
# role: pve
# file: tasks/hardening/kernel_cmdline.yml

- name: "PVE | Stat proxmox kernel command line"
  ansible.builtin.stat:
    path: "{{ __pve_kernel_cmdline_path }}"
  register: __pve_kernel_cmdline_file

- name: "PVE | Manage proxmox kernel command line arguments"
  when: __pve_kernel_cmdline_file.stat.exists | bool
  block:
    - name: "PVE | Add proxmox kernel command line arguments"
      ansible.builtin.lineinfile:
        path: "{{ __pve_kernel_cmdline_path }}"
        create: false
        regexp: '^(?!.*(?:^|\s){{ item.key | regex_escape }}(?:\s|$))(.*)$'
        line: '\1 {{ item.key }}'
        backrefs: true
        owner: root
        group: root
        mode: "0644"
      notify: pve refresh proxmox boot
      loop: "{{ pve_cmdline | default({}) | dict2items }}"
      when:
        - item.value | bool
        - item.key not in __pve_kernel_cmdline_intel_only_args
          or 'intel' in (ansible_facts['processor'] | default([]) | join(' ') | lower)
        - item.key not in __pve_kernel_cmdline_amd_only_args
          or 'amd' in (ansible_facts['processor'] | default([]) | join(' ') | lower)

- name: "PVE | Manage GRUB kernel command line fallback"
  when: not __pve_kernel_cmdline_file.stat.exists | bool
  block:
    - name: "PVE | Ensure GRUB drop-in directory exists"
      ansible.builtin.file:
        path: "{{ __pve_kernel_cmdline_grub_dropin_path | dirname }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: "PVE | Add GRUB kernel command line drop-in header"
      ansible.builtin.lineinfile:
        path: "{{ __pve_kernel_cmdline_grub_dropin_path }}"
        create: true
        insertbefore: BOF
        line: "# Ansible managed: PVE kernel command line hardening."
        owner: root
        group: root
        mode: "0644"

    - name: "PVE | Add GRUB kernel command line arguments"
      ansible.builtin.lineinfile:
        path: "{{ __pve_kernel_cmdline_grub_dropin_path }}"
        create: true
        regexp: '^GRUB_CMDLINE_LINUX_DEFAULT="\$\{GRUB_CMDLINE_LINUX_DEFAULT:\+\$GRUB_CMDLINE_LINUX_DEFAULT \}{{ item.key | regex_escape }}"$'
        line: 'GRUB_CMDLINE_LINUX_DEFAULT="${GRUB_CMDLINE_LINUX_DEFAULT:+$GRUB_CMDLINE_LINUX_DEFAULT }{{ item.key }}"'
        owner: root
        group: root
        mode: "0644"
      notify: pve update grub
      loop: "{{ pve_cmdline | default({}) | dict2items }}"
      when:
        - item.value | bool
        - item.key not in __pve_kernel_cmdline_intel_only_args
          or 'intel' in (ansible_facts['processor'] | default([]) | join(' ') | lower)
        - item.key not in __pve_kernel_cmdline_amd_only_args
          or 'amd' in (ansible_facts['processor'] | default([]) | join(' ') | lower)

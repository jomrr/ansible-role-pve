---
- name: "PVE | Remount existing hardened mountpoints"
  ansible.builtin.command:
    argv:
      - mount
      - -o
      - "remount,{{ (__pve_mount_existing_options + __pve_mount_missing_options) | unique | join(',') }}"
      - "{{ item.key }}"
  changed_when: true
  loop: "{{ pve_hardening_mount_policy | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  vars:
    __pve_mount_info: "{{ pve_mounts_by_mount[item.key] | default({}) }}"
    __pve_mount_existing_options: "{{ (__pve_mount_info.options | default('') | string).split(',') }}"
    __pve_mount_noexec_enabled: >-
      {{ item.value.noexec_var is defined and (lookup('ansible.builtin.vars', item.value.noexec_var) | bool) }}
    __pve_mount_desired_options: "{{ (item.value.options + (['noexec'] if __pve_mount_noexec_enabled else [])) | unique }}"
    __pve_mount_missing_options: "{{ __pve_mount_desired_options | difference(__pve_mount_existing_options) }}"
  when:
    - not pve_is_container | bool
    - item.key in pve_mounts_by_mount
    - item.key != '/tmp' or pve_tmp_mount_masked | bool or not pve_tmp_mount_available | bool
    - __pve_mount_missing_options | length > 0

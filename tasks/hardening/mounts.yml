---
# role: pve
# file: tasks/hardening/mounts.yml

- name: "PVE | Persistently harden existing mountpoints"
  ansible.posix.mount:
    path: "{{ item.key }}"
    src: "{{ __pve_mount_info.device }}"
    fstype: "{{ __pve_mount_info.fstype }}"
    opts: "{{ (__pve_mount_existing_options + __pve_mount_desired_options) | reject('equalto', '') | unique | join(',') }}"
    state: mounted
  loop: "{{ __pve_hardening_mount_policy | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  vars:
    __pve_mount_info: "{{ __pve_mounts_by_mount[item.key] | default({}) }}"
    __pve_mount_existing_options: "{{ (__pve_mount_info.options | default('') | string).split(',') }}"
    __pve_mount_noexec_enabled: >-
      {{ item.value.noexec_var is defined and (lookup('ansible.builtin.vars', item.value.noexec_var) | bool) }}
    __pve_mount_desired_options: "{{ (item.value.options + (['noexec'] if __pve_mount_noexec_enabled else [])) | unique }}"
  when:
    - not __pve_is_container | bool
    - item.key in __pve_mounts_by_mount
    - __pve_mount_info.device | default('') | length > 0
    - __pve_mount_info.fstype | default('') | length > 0
    - item.key != '/tmp' or __pve_tmp_mount_masked | bool or not __pve_tmp_mount_available | bool

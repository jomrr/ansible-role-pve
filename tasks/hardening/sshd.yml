---
# role: pve
# file: tasks/hardening/sshd.yml

- name: "PVE | Ensure sshd drop-in directory exists"
  ansible.builtin.file:
    path: "{{ pve_hardening_sshd_config_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: "PVE | Install sshd hardening drop-in"
  ansible.builtin.template:
    src: sshd-pve-hardening.conf.j2
    dest: "{{ pve_hardening_sshd_config_path }}"
    owner: root
    group: root
    mode: "0644"
  notify: pve reload sshd

---
# role: pve
# file: tasks/main.yml

- name: "PVE | Validate role inputs"
  ansible.builtin.import_tasks: assert.yml

- name: "PVE | Collect target facts"
  ansible.builtin.import_tasks: facts.yml

- name: "PVE | Manage no-subscription repository and warning suppression"
  ansible.builtin.import_tasks: no_subscription.yml
  when: pve_no_subscription | bool

- name: "PVE | Manage HA service masking"
  ansible.builtin.import_tasks: ha.yml
  when: pve_ha_mask_services | bool

- name: "PVE | Apply PVE-safe hardening"
  ansible.builtin.import_tasks: hardening.yml
  when: pve_hardening_enabled | bool

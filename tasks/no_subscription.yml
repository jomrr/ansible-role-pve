---
# role: pve
# file: tasks/no_subscription.yml

- name: "PVE | Ensure no-subscription script directory exists"
  ansible.builtin.file:
    path: "{{ __pve_no_subscription_nag_script_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: "PVE | Install no-subscription warning suppression script"
  ansible.builtin.template:
    src: no-subscription-nag.sh.j2
    dest: "{{ __pve_no_subscription_nag_script_path }}"
    owner: root
    group: root
    mode: "0755"

- name: "PVE | Ensure APT hook directory exists"
  ansible.builtin.file:
    path: "{{ __pve_no_subscription_nag_apt_hook_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: "PVE | Install no-subscription warning APT hook"
  ansible.builtin.template:
    src: apt-hook-no-subscription-nag.j2
    dest: "{{ __pve_no_subscription_nag_apt_hook_path }}"
    owner: root
    group: root
    mode: "0644"

- name: "PVE | Stat no-subscription JavaScript candidates"
  ansible.builtin.stat:
    path: "{{ item }}"
  register: __pve_no_subscription_nag_candidate_stats
  loop: "{{ __pve_no_subscription_nag_candidate_paths }}"

- name: "PVE | Run no-subscription warning suppression when PVE files exist"
  ansible.builtin.command:
    argv:
      - "{{ __pve_no_subscription_nag_script_path }}"
  environment:
    PVE_NAG_FILE: "{{ __pve_no_subscription_nag_candidate_path }}"
  register: __pve_no_subscription_run
  changed_when: __pve_no_subscription_run.stdout is search('^patched:')
  vars:
    __pve_no_subscription_nag_existing_paths: >-
      {{ __pve_no_subscription_nag_candidate_stats.results | selectattr('stat.exists') | map(attribute='item') | list }}
    __pve_no_subscription_nag_candidate_path: "{{ __pve_no_subscription_nag_existing_paths | first | default('') }}"
  when: __pve_no_subscription_nag_candidate_path | length > 0

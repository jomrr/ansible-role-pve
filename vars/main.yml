---
# role: pve
# file: vars/main.yml

# Internal implementation details for the pve role.
__pve_no_subscription_nag_script_path: /usr/local/sbin/pve-disable-subscription-nag
__pve_no_subscription_nag_apt_hook_path: /etc/apt/apt.conf.d/99-pve-disable-subscription-nag
__pve_no_subscription_sources_path: /etc/apt/sources.list.d/proxmox.sources
__pve_enterprise_sources_path: /etc/apt/sources.list.d/pve-enterprise.sources
__pve_legacy_no_subscription_list_path: /etc/apt/sources.list.d/pve-no-subscription.list
__pve_legacy_enterprise_list_path: /etc/apt/sources.list.d/pve-enterprise.list
__pve_proxmox_apt_suite: trixie
__pve_proxmox_apt_keyring_path: /usr/share/keyrings/proxmox-archive-keyring.gpg
__pve_no_subscription_repository_uri: http://download.proxmox.com/debian/pve
__pve_no_subscription_repository_component: pve-no-subscription
__pve_enterprise_repository_uri: https://enterprise.proxmox.com/debian/pve
__pve_enterprise_repository_component: pve-enterprise
__pve_no_subscription_nag_candidate_paths:
  - /usr/share/javascript/proxmox-widget-toolkit/proxmoxlib.js
  - /usr/share/pve-manager/js/pvemanagerlib.js

__pve_container_types:
  - container
  - containerd
  - docker
  - lxc
  - podman
  - systemd-nspawn

__pve_marker_paths:
  - /etc/pve
  - /usr/bin/pveversion

__pve_package_markers:
  - proxmox-ve
  - pve-manager
  - pve-cluster

__pve_service_markers:
  - pve-cluster.service
  - pvedaemon.service
  - pveproxy.service
  - pvestatd.service

__pve_tmp_mount_unit_paths:
  - /etc/systemd/system/tmp.mount
  - /run/systemd/system/tmp.mount
  - /usr/lib/systemd/system/tmp.mount
  - /lib/systemd/system/tmp.mount

__pve_tmp_mount_active_states:
  - active
  - mounted
  - running

__pve_ha_resources_config_path: /etc/pve/ha/resources.cfg

__pve_hardening_absent_packages:
  - nis
  - rsh-client
  - talk
  - telnet
  - xinetd

__pve_hardening_modprobe_path: /etc/modprobe.d/pve-hardening.conf
__pve_hardening_kernel_modules:
  - dccp
  - tipc
  - rds
  - sctp
  - cramfs
  - freevxfs
  - jffs2
  - hfs
  - hfsplus
  - udf

__pve_hardening_sysctl_config_path: /etc/sysctl.d/99-pve-hardening.conf
__pve_hardening_sysctl_apply_runtime: true
__pve_hardening_sysctl_values:
  kernel.kptr_restrict: 2
  kernel.dmesg_restrict: 1
  kernel.randomize_va_space: 2
  fs.protected_hardlinks: 1
  fs.protected_symlinks: 1
  fs.suid_dumpable: 0
  net.ipv4.conf.all.accept_redirects: 0
  net.ipv4.conf.default.accept_redirects: 0
  net.ipv4.conf.all.accept_source_route: 0
  net.ipv4.conf.default.accept_source_route: 0
  net.ipv4.conf.all.log_martians: 1
  net.ipv4.conf.default.log_martians: 1
  net.ipv4.conf.all.secure_redirects: 0
  net.ipv4.conf.default.secure_redirects: 0
  net.ipv4.conf.all.send_redirects: 0
  net.ipv4.conf.default.send_redirects: 0
  net.ipv4.icmp_echo_ignore_bogus_error_responses: 1
  net.ipv4.icmp_echo_ignore_broadcasts: 1
  net.ipv4.tcp_syncookies: 1
  net.ipv6.conf.all.accept_redirects: 0
  net.ipv6.conf.default.accept_redirects: 0
  net.ipv6.conf.all.accept_source_route: 0
  net.ipv6.conf.default.accept_source_route: 0

__pve_hardening_sshd_config_path: /etc/ssh/sshd_config.d/10-pve-hardening.conf
__pve_hardening_sshd_service_name: ssh.service

__pve_hardening_auditd_packages:
  - auditd
__pve_hardening_auditd_rules_path: /etc/audit/rules.d/99-pve-hardening.rules

__pve_hardening_tmp_acl_paths:
  - /tmp
  - /var/tmp

__pve_hardening_mount_policy:
  /tmp:
    options:
      - nodev
      - nosuid
  /var/tmp:
    options:
      - nodev
      - nosuid
  /dev/shm:
    options:
      - nodev
      - nosuid
    noexec_var: pve_hardening_dev_shm_noexec

__pve_kernel_cmdline_path: /etc/kernel/cmdline
__pve_kernel_cmdline_grub_dropin_path: /etc/default/grub.d/10-pve-hardening.cfg
__pve_kernel_cmdline_proxmox_boot_tool_path: /usr/sbin/proxmox-boot-tool
__pve_kernel_cmdline_update_grub_path: /usr/sbin/update-grub

__pve_kernel_cmdline_intel_only_args:
  - intel_iommu=on

__pve_kernel_cmdline_amd_only_args:
  - amd_iommu=force_isolation
